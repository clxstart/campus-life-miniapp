server:
  port: ${CAMPUS_PORT:8080}
  # 生产环境建议：Tomcat 最大线程数（默认 200 够用，高并发可调至 300）
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 200
    max-connections: 8192

spring:
  # 没显式指定 profile 时按 dev 跑（等价于原来的「本机默认配置」）。
  # 生产部署必须显式：--spring.profiles.active=prod
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池：默认 10 个撑不住 1000 同时在线，按 4C4G 机器调到 25
    # 计算依据：单请求占用时长约 20ms，25 连接 ≈ 1250 QPS 上限
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 10000      # 获取连接超时 10s
      idle-timeout: 600000           # 空闲连接 10 分钟回收
      max-lifetime: 1800000          # 连接最长存活 30 分钟（小于 MySQL wait_timeout）
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 本文件只放「与环境无关」的开关与默认值；
# 数据库地址、密钥、回调域名这类东西一律放 application-{dev,prod}.yml。
# 部署形态（finding-10）：
#   single  —— 单实例：上传落本机、限流/群聊房间/任务锁都在进程内。开发默认值。
#   cluster —— 多实例：必须配置 Redis 与 S3 兼容对象存储，缺任何一项启动直接失败（不静默降级）。
# 生产请通过环境变量显式声明，见 application-prod.yml。
campus:
  ha:
    mode: ${CAMPUS_HA_MODE:single}
    node-id: ${CAMPUS_HA_NODE_ID:}
    redis-url: ${CAMPUS_HA_REDIS_URL:}
    redis-timeout-ms: ${CAMPUS_HA_REDIS_TIMEOUT_MS:2000}
    # readiness 探测 Redis 的有界上界，必须小于负载均衡/编排探针超时，避免 Redis 挂死时探针一起卡住
    redis-health-timeout-ms: ${CAMPUS_HA_REDIS_HEALTH_TIMEOUT_MS:500}
    # 共享限流不可用时是否放行；默认 false = 拒绝（fail-closed），避免 Redis 抖动导致限流失效
    rate-limit-fail-open: ${CAMPUS_HA_RATE_LIMIT_FAIL_OPEN:false}
    storage:
      type: ${CAMPUS_HA_STORAGE_TYPE:local}
      endpoint: ${CAMPUS_HA_STORAGE_ENDPOINT:}
      region: ${CAMPUS_HA_STORAGE_REGION:}
      bucket: ${CAMPUS_HA_STORAGE_BUCKET:}
      access-key: ${CAMPUS_HA_STORAGE_ACCESS_KEY:}
      secret-key: ${CAMPUS_HA_STORAGE_SECRET_KEY:}
      public-base-url: ${CAMPUS_HA_STORAGE_PUBLIC_BASE_URL:}
  auth:
    # 写接口与「我的数据」接口是否强制校验 token。
    # 关掉会退回「谁传 userId 就代表谁」的旧行为（任何人可冒充任意用户），只允许本机调试时临时关闭。
    enforce: ${CAMPUS_AUTH_ENFORCE:true}
    # 开发登录默认只能登录 1 号演示账号。需要切换成其他账号调试多用户场景时打开这个开关；
    # prod profile 下即使配了 true 也不生效。
    dev-login-any-user: ${CAMPUS_DEV_LOGIN_ANY_USER:false}
  jwt:
    ttl-seconds: 604800
    # 管理端 token 有效期：8 小时（比小程序短，管理权限更敏感）
    admin-ttl-seconds: 28800
  web:
    # 管理端（web/）跨域白名单，逗号分隔，支持 http://127.0.0.1:* 这种端口通配。
    # 部署到真实域名后必须换成自己的前端域名，否则浏览器会拦掉所有接口。
    allowed-origins: ${CAMPUS_WEB_ORIGINS:http://127.0.0.1:*,http://localhost:*}
  pay:
    # 微信支付未开启时，是否允许「模拟支付」把订单直接标记为已付款。
    # 只用于本地演示：prod profile 下代码会拒绝模拟支付，写 true 也没用。
    simulate: ${CAMPUS_PAY_SIMULATE:true}
    reconcile:
      # 单轮对账处理的订单上限与时间预算（finding-11）：超出即顺延到下一轮，避免长事务与连接池耗尽
      batch-size: ${CAMPUS_PAY_RECONCILE_BATCH:100}
      budget-ms: ${CAMPUS_PAY_RECONCILE_BUDGET_MS:20000}
      interval-ms: ${CAMPUS_PAY_RECONCILE_INTERVAL_MS:60000}
    compensation:
      # 「关单后到账」自动退款：默认开启，多个节点靠租约锁 + 确定性退款单号保证不会重复退
      auto-refund: ${CAMPUS_PAY_AUTO_REFUND:true}
      interval-ms: ${CAMPUS_PAY_COMPENSATION_INTERVAL_MS:120000}
  wx:
    appid: ${CAMPUS_WX_APPID:}
    secret: ${CAMPUS_WX_SECRET:}
  upload:
    dir: ${CAMPUS_UPLOAD_DIR:uploads}
    public-prefix: /uploads
    # 上传接口返回的图片基址：必须是小程序可访问的 http(s) 地址
    base-url: ${CAMPUS_UPLOAD_BASE_URL:http://127.0.0.1:8080}

# 微信支付：下单 + 退款 + 退款回调的唯一配置源
# （历史上存在过 campus.wxpay 第二套前缀，两套 enabled 开关会拼出「能下单不能退款」的半配置状态，已合并）
wxpay:
  enabled: ${WXPAY_ENABLED:false}
  app-id: ${WXPAY_APP_ID:}
  mch-id: ${WXPAY_MCH_ID:}
  api-v3-key: ${WXPAY_API_V3_KEY:}
  cert-serial-no: ${WXPAY_CERT_SERIAL_NO:}
  private-key-path: ${WXPAY_PRIVATE_KEY_PATH:}
  notify-url: ${WXPAY_NOTIFY_URL:https://your-domain.example/api/pay/notify}
  refund-notify-url: ${WXPAY_REFUND_NOTIFY_URL:https://your-domain.example/api/pay/refund/notify}
  sandbox: false

# ============================================================
# 健康检查与指标（Spring Boot Actuator）
# 只暴露 health / info / metrics 三个端点。其余（beans、env、heapdump 等）默认关闭，
# 避免把内部配置和内存快照暴露出去。
# 访问控制：路径在 /actuator/** 下，由 Nginx 限制为仅本机或内网访问；
# 管理端要看数据走 /api/admin/system/overview（带管理员鉴权）。
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 对外只返回 UP/DOWN，不暴露数据库地址、磁盘路径等细节；
      # 完整明细通过 /api/admin/system/overview（管理员鉴权）读取
      show-details: never
      show-components: never
      probes:
        enabled: true
      # liveness 只看进程本身：数据库/存储抖动时由 readiness 摘流量，不要让编排把实例反复重启（finding-10）
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,campus
  health:
    diskspace:
      enabled: true
      threshold: 1GB

