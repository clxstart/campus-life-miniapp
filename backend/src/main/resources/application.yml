server:
  port: 8080
  # 生产环境建议：Tomcat 最大线程数（默认 200 够用，高并发可调至 300）
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 200
    max-connections: 8192
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_life?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: chang090011
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池：默认 10 个撑不住 1000 同时在线，按 4C4G 机器调到 25
    # 计算依据：单请求占用时长约 20ms，25 连接 ≈ 1250 QPS 上限
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 10000      # 获取连接超时 10s
      idle-timeout: 600000           # 空闲连接 10 分钟回收
      max-lifetime: 1800000          # 连接最长存活 30 分钟（小于 MySQL wait_timeout）
      connection-test-query: SELECT 1
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
# 登录鉴权：未配置微信 AppID 时启用开发登录（/api/auth/dev-login），便于 touristappid 下跑通流程。
campus:
  jwt:
    # ⌈生产环境必须改为环境变量注入的随机密钥⌋
    secret: campus-life-local-dev-secret-please-change-in-production
    ttl-seconds: 604800
    # 管理端 token 有效期：8 小时（比小程序短，管理权限更敏感）
    admin-ttl-seconds: 28800
  wx:
    appid: ''
    secret: ''
  wxpay:
    enabled: false
    merchant-id: ''
    merchant-serial-number: ''
    private-key-path: ''
    api-v3-key: ''
    refund-notify-url: ''
  upload:
    dir: uploads
    public-prefix: /uploads
    # 上传接口返回的图片基址：必须是小程序可访问的 http(s) 地址
    # 生产环境改为真实域名（如 https://api.example.com）
    base-url: http://127.0.0.1:8080
wxpay:
  enabled: false
  app-id: ''
  mch-id: ''
  api-v3-key: ''
  cert-serial-no: ''
  private-key-path: ''
  notify-url: 'https://your-domain.example/api/pay/notify'
  sandbox: false
# 生产环境请将前端基址切换为 HTTPS，并在微信公众平台配置 request 合法域名。
